services:
  - type: web
    name: artisans-api
    env: node
    plan: free
    rootDir: .
    buildCommand: npm ci --prefix server && npm --prefix server run build && npm ci --prefix admin-web --legacy-peer-deps && npm --prefix admin-web run build
    startCommand: npm --prefix server start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_WEBHOOK_SECRET
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        value: /api/v1
      - key: CORS_ORIGINS
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: BREVO_API_KEY
        sync: false
