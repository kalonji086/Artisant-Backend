name: CI / CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  SERVER_DIR: ./server
  FRONTEND_DIR: ./admin-web

jobs:
  backend:
    name: Backend - Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVER_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ env.SERVER_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and type-check
        run: npm run build

  frontend:
    name: Frontend - Build & TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and type-check
        run: npm run build

  lint:
    name: Lint (both projects)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint backend
        working-directory: ./server
        run: |
          npm ci
          npx eslint src/ --ext .ts || echo "ESLint not configured, skipping"

      - name: Lint admin dashboard
        working-directory: ./admin-web
        run: |
          npm ci --legacy-peer-deps
          npx eslint src/ --ext .ts,.tsx || echo "ESLint not configured, skipping"